[tool.black]
line-length = 120
target_version = ['py36']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.vscode
    | \.idea
    | _build
    | buck-out
    | build
    | dist
    | venv
    | lookup-tables
  )/
)
'''
# "make format" feeds black an explicit git-derived file list, which already honors
# rubikscubelookuptables/.gitignore. This only guards a bare "black ." run, where the
# generated modules would otherwise cost minutes (builder555ss.py is 61MB).
force-exclude = '''
(
  /rubikscubelookuptables/(builder555ss|builder777ss)\.py$
)
'''

# packages that are required for setup.py to run must be listed here
[build-system]
requires=["setuptools==84.0.0", "wheel==0.48.0"]
