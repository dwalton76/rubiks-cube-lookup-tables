[tool.black]
line-length = 120
target_version = ['py36']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.vscode
    | \.idea
    | _build
    | buck-out
    | build
    | dist
    | venv
    | lookup-tables
    | rubikscubelookuptables/builder555ss.py
    | rubikscubelookuptables/builder777ss.py
    | rubikscubelookuptables/.*.gz
  )/
)
'''

# packages that are required for setup.py to run must be listed here
[build-system]
requires=["setuptools==84.0.0", "wheel==0.48.0"]
